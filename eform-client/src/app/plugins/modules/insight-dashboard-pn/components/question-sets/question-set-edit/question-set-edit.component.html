<h3 mat-dialog-title>{{ (isEdit ? 'Rename question set' : 'New question set') | translate }}</h3>
<div mat-dialog-content>
  <mat-form-field class="w-100">
    <mat-label>{{ 'Name' | translate }}</mat-label>
    <input matInput type="text" [(ngModel)]="name" id="questionSetNameInput" />
  </mat-form-field>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
  <button
    mat-raised-button
    color="accent"
    id="questionSetSaveBtn"
    [disabled]="!name"
    (click)="save()"
  >
    {{ 'Save' | translate }}
  </button>
  <button mat-raised-button id="questionSetCancelBtn" (click)="hide()">
    {{ 'Cancel' | translate }}
  </button>
</div>

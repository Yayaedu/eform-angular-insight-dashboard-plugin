<h3 mat-dialog-title>{{ 'Delete question' | translate }}</h3>
<div mat-dialog-content>
  <p>{{ 'Are you sure you want to delete' | translate }} <strong>{{ question.text }}</strong>?</p>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
  <button mat-raised-button color="warn" id="questionDeleteSaveBtn" (click)="delete()">
    {{ 'Delete' | translate }}
  </button>
  <button mat-raised-button id="questionDeleteCancelBtn" (click)="hide()">
    {{ 'Cancel' | translate }}
  </button>
</div>

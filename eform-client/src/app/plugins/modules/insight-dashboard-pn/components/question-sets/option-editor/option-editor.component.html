<h3 mat-dialog-title>{{ 'Answer options' | translate }} — {{ question.text }}</h3>
<div mat-dialog-content>
  <div class="d-flex flex-row align-items-center mb-2" *ngFor="let option of options">
    <mat-form-field class="flex-grow-1">
      <input
        matInput
        type="text"
        [(ngModel)]="option.label"
        (blur)="saveLabel(option)"
        id="optionLabelInput-{{ option.id }}"
      />
    </mat-form-field>
    <button
      mat-icon-button
      id="deleteOptionBtn-{{ option.id }}"
      (click)="deleteOption(option)"
      matTooltip="{{ 'Delete' | translate }}"
    >
      <mat-icon color="warn">delete</mat-icon>
    </button>
  </div>

  <div class="d-flex flex-row align-items-center">
    <mat-form-field class="flex-grow-1">
      <mat-label>{{ 'New option' | translate }}</mat-label>
      <input matInput type="text" [(ngModel)]="newLabel" id="newOptionInput" (keyup.enter)="addOption()" />
    </mat-form-field>
    <button mat-icon-button id="addOptionBtn" [disabled]="!newLabel" (click)="addOption()">
      <mat-icon color="accent">add</mat-icon>
    </button>
  </div>
</div>
<div mat-dialog-actions class="d-flex flex-row justify-content-end">
  <button mat-raised-button color="accent" id="optionEditorCloseBtn" (click)="hide()">
    {{ 'Done' | translate }}
  </button>
</div>

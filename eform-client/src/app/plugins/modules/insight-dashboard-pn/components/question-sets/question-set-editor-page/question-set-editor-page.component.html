<eform-new-subheader>
  <button mat-icon-button id="backToListBtn" (click)="backToList()" matTooltip="{{ 'Back' | translate }}">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span class="ml-2">{{ questionSet.name }}</span>
</eform-new-subheader>

<div class="d-flex flex-column m-3" *ngIf="loaded">
  <mat-card
    *ngFor="let question of questionSet.questions; let i = index"
    class="mb-2 p-2"
  >
    <div class="d-flex flex-row justify-content-between align-items-center">
      <div class="d-flex flex-column">
        <strong>{{ i + 1 }}. {{ question.text }}</strong>
        <span>{{ questionTypeLabel(question.questionType) | translate }}</span>
      </div>
      <div class="d-flex flex-row align-items-center">
        <button
          mat-icon-button
          id="moveUpBtn-{{ question.id }}"
          [disabled]="i === 0"
          (click)="moveUp(question)"
          matTooltip="{{ 'Move up' | translate }}"
        >
          <mat-icon>arrow_upward</mat-icon>
        </button>
        <button
          mat-icon-button
          id="moveDownBtn-{{ question.id }}"
          [disabled]="i === questionSet.questions.length - 1"
          (click)="moveDown(question)"
          matTooltip="{{ 'Move down' | translate }}"
        >
          <mat-icon>arrow_downward</mat-icon>
        </button>
        <button
          mat-icon-button
          *ngIf="questionTypeHasManualOptions(question.questionType)"
          id="editOptionsBtn-{{ question.id }}"
          (click)="openOptionEditor(question)"
          matTooltip="{{ 'Answer options' | translate }}"
        >
          <mat-icon>list</mat-icon>
        </button>
        <button
          mat-icon-button
          id="editQuestionBtn-{{ question.id }}"
          (click)="openEditQuestionDialog(question)"
          matTooltip="{{ 'Edit' | translate }}"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          id="deleteQuestionBtn-{{ question.id }}"
          (click)="openDeleteQuestionDialog(question)"
          matTooltip="{{ 'Delete' | translate }}"
        >
          <mat-icon color="warn">delete</mat-icon>
        </button>
      </div>
    </div>
  </mat-card>

  <mat-card *ngIf="questionSet.questions.length === 0" class="mb-2 p-3">
    <p>{{ 'No questions yet — add the first one below.' | translate }}</p>
  </mat-card>

  <button mat-raised-button color="accent" id="addQuestionBtn" (click)="openAddQuestionDialog()" class="align-self-start">
    {{ 'Add question' | translate }}
  </button>
</div>
